plugins { id 'com.android.application' version '8.8.0' }
android {
 namespace 'pl.offline.supaplex'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'pl.offline.supaplex'
  testInstrumentationRunner 'pl.offline.supaplex.HudInstrumentation'
  minSdk 21
  targetSdk 35
  versionCode 4
  versionName '1.3'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; targets 'main' } }
 }
 externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
 sourceSets.main.java.srcDirs += '../../vendor/SDL/android-project/app/src/main/java'
 buildTypes { release { minifyEnabled false } }
 packaging { jniLibs { useLegacyPackaging false } }
}
